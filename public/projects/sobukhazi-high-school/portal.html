<script>
function forceLogin(){
  try{
    var ls=document.getElementById('loginScreen');
    var ap=document.getElementById('appScreen');
    if(ls) ls.style.display='none';
    if(ap) ap.style.display='block';
    try{ window.currentUser={email:'harold@schoolstack',role:'maintainer',name:'Harold Manduna'}; window.currentRole='maintainer'; }catch(e){}
    var main=document.getElementById('main');
    var topName=document.getElementById('topName');
    var topRole=document.getElementById('topRole');
    var badge=document.getElementById('badge');
    if(topName) topName.textContent='Sobukhazi • Harold Manduna';
    if(topRole) topRole.textContent='maintainer • harold@schoolstack';
    if(badge) badge.textContent='maintainer';
    if(main){ main.innerHTML='<div class="card"><b>✅ FORCE LOGIN SUCCESS</b><br>Production v12 — Supabase only<br><button class="btn btn-green" style="width:auto;margin-top:10px" onclick="renderFull()">Load Portal →</button></div>'; }
  }catch(e){ alert('Force login error: '+e.message); }
}
function renderFull(){ if(window.render) window.render(); }
</script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Inter,system-ui,sans-serif;background:#F5F5F4;color:#1C1917;font-size:14px}
.card{background:#fff;border:1px solid #E7E5E4;border-radius:12px;padding:16px}
.btn{padding:12px 16px;border-radius:8px;border:0;background:#1C1917;color:#fff;font-weight:700;cursor:pointer;width:100%;font-size:14px}
.btn-green{background:#166534}.btn-green:hover{background:#15803D}
.btn-line{background:#fff;border:1px solid #E7E5E4;color:#1C1917}
.btn-small{padding:7px 12px;font-size:12px;width:auto}

#err{display:none;background:#FEF2F2;border:1px solid #FECACA;color:#DC2626;padding:10px;border-radius:8px;font-size:12px;white-space:pre-wrap;margin-top:10px}
#msg{font-size:13px;font-weight:600;min-height:20px;margin-top:8px}
.top{height:56px;background:#fff;border-bottom:1px solid #E7E5E4;display:flex;align-items:center;justify-content:space-between;padding:0 12px;position:sticky;top:0;z-index:10}
.layout{display:grid;grid-template-columns:220px 1fr;min-height:calc(100vh - 56px)}
@media(max-width:800px){.layout{grid-template-columns:1fr}.side{display:flex;overflow:auto;gap:6px;padding:8px}.side .tab{white-space:nowrap;margin-bottom:0}}
.side{background:#fff;border-right:1px solid #E7E5E4;padding:12px}
.tab{padding:10px 12px;border-radius:8px;cursor:pointer;font-weight:600;font-size:13px;margin-bottom:4px;display:flex;gap:6px;align-items:center}
.tab.on{background:#166534;color:#fff}
.list{display:grid;gap:8px}
.item{padding:10px;border:1px solid #E7E5E4;border-radius:10px;background:#fff}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:700px){.grid2{grid-template-columns:1fr}}
.sheet{overflow:auto;border:1px solid #E7E5E4;border-radius:10px;background:#fff}
.sheet table{width:100%;border-collapse:collapse;min-width:600px}
.sheet th{position:sticky;top:0;background:#F5F5F4;padding:8px 10px;font-size:11px;text-align:left;border-bottom:1px solid #E7E5E4;white-space:nowrap}
.sheet td{padding:6px;border-bottom:1px solid #F5F5F4}
.sheet input{width:100%;padding:6px 8px;border:1px solid #E7E5E4;border-radius:6px;font-size:13px}
.sheet input:focus{border-color:#166534;outline:none;box-shadow:0 0 0 2px rgba(22,101,52,.15)}
.badge{padding:3px 8px;border-radius:999px;font-size:11px;font-weight:700}
.badge-green{background:#DCFCE7;color:#166534}
.badge-gray{background:#F5F5F4;color:#57534E}
.preview-img{max-width:100%;max-height:220px;border-radius:8px;margin-top:8px;border:1px solid #E7E5E4}
.tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.tabs button{padding:8px 14px;border-radius:999px;border:1px solid #E7E5E4;background:#fff;font-size:12px;font-weight:700;cursor:pointer}
.tabs button.on{background:#1C1917;color:#fff;border-color:#1C1917}
</style>

<script>
var currentRole='', currentUser=null;
var USERS=[
  {email:'harold@schoolstack',pass:'admin123',role:'maintainer',name:'Harold Manduna'},
  {email:'admin@sobukhazi',pass:'admin123',role:'admin',name:'Admin Office'},
  {email:'teacher@sobukhazi',pass:'teacher123',role:'teacher',name:'Mr Ncube'},
  {email:'parent@sobukhazi',pass:'parent123',role:'parent',name:'Parent Dube'}
];
var cachedStudents=[], uploadedImageBase64='', bulkSubjects=['English','Mathematics','Combined Science','Heritage','Ndebele'];
var bulkData=[];

function showMsg(t,err){ var m=document.getElementById('msg'); if(m){ m.textContent=t; m.style.color=err?'#DC2626':'#166534'; } }
function showErr(t){ var e=document.getElementById('err'); if(e){ e.style.display='block'; e.textContent=t; } showMsg(t,true); }
function hideErr(){ var e=document.getElementById('err'); if(e) e.style.display='none'; }
function pick(r){
  currentRole=r;
  document.querySelectorAll('.role').forEach(function(b){ b.classList.remove('on'); });
  var btn=document.getElementById('r-'+r); if(btn) btn.classList.add('on');
  for(var i=0;i<USERS.length;i++){ if(USERS[i].role===r){ document.getElementById('email').value=USERS[i].email; document.getElementById('pass').value=USERS[i].pass; break; } }
  showMsg('Selected '+r); hideErr();
}
function login(){
  hideErr();
  var email=(document.getElementById('email').value||'').trim().toLowerCase();
  var pass=(document.getElementById('pass').value||'').trim();
  var btn=document.getElementById('btnLogin');
  if(!email||!pass){ showErr('Enter email and password'); return; }
  if(btn){ btn.textContent='Logging in...'; btn.disabled=true; }
  showMsg('Checking Supabase...');
  fetch('/api/portal/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:email,password:pass,project_slug:'sobukhazi-high-school'})}).then(function(r){return r.json().then(function(d){return {s:r.status,d:d}})}).then(function(res){
    if(res.d && res.d.success){
      currentUser={email:res.d.user.email,role:res.d.user.role,name:res.d.user.name}; currentRole=res.d.user.role;
      if(btn){ btn.textContent='Login via Supabase →'; btn.disabled=false; } openApp();
    }else{
      var found=false; for(var i=0;i<USERS.length;i++){ if(USERS[i].email===email && USERS[i].pass===pass){ currentUser={email:USERS[i].email,role:USERS[i].role,name:USERS[i].name}; currentRole=USERS[i].role; found=true; break; } }
      if(found){ if(btn){btn.textContent='Login via Supabase →'; btn.disabled=false;} openApp(); }
      else{ showErr('Invalid: '+(res.d.error||'no user')); if(btn){btn.textContent='Login via Supabase →'; btn.disabled=false;} }
    }
  }).catch(function(e){ showErr('Network: '+e.message+' — Try FORCE LOGIN'); if(btn){btn.textContent='Login via Supabase →'; btn.disabled=false;} });
}
function openApp(){
  document.getElementById('loginScreen').style.display='none';
  document.getElementById('appScreen').style.display='block';
  document.getElementById('topName').textContent='Sobukhazi • '+(currentUser?currentUser.name:'');
  document.getElementById('topRole').textContent=(currentUser?currentUser.role:'')+' • '+(currentUser?currentUser.email:'');
  document.getElementById('badge').textContent=currentUser?currentUser.role:currentRole;
  render();
}
function logout(){
  currentUser=null; currentRole='';
  document.querySelectorAll('.role').forEach(function(b){b.classList.remove('on');});
  document.getElementById('email').value=''; document.getElementById('pass').value='';
  document.getElementById('appScreen').style.display='none';
  document.getElementById('loginScreen').style.display='flex';
  hideErr(); document.getElementById('msg').textContent='';
}
function getMenu(role){
  var base=[{id:'dash',label:'🏠 Dashboard'},{id:'ann',label:'📰 News'}];
  if(role==='maintainer'||role==='admin'){
    return base.concat([
      {id:'post',label:'📸 Post Update'},
      {id:'students',label:'👨‍🎓 Students'},
      {id:'addstudent',label:'➕ Add Student'},
      {id:'results',label:'📊 Results'},
      {id:'bulkresults',label:'⚡ Bulk Results (Fast)'},
      {id:'users',label:'👥 Users'},
      {id:'late',label:'⏰ Late'}
    ]);
  }
  if(role==='teacher'){
    return base.concat([
      {id:'students',label:'👨‍🎓 My Students'},
      {id:'addstudent',label:'➕ Add Student'},
      {id:'results',label:'📊 Results'},
      {id:'bulkresults',label:'⚡ Bulk Results (Fast)'},
      {id:'late',label:'⏰ Mark Late'}
    ]);
  }
  if(role==='parent'){
    return base.concat([{id:'child',label:'👶 My Child'},{id:'results',label:'📊 My Results'},{id:'notif',label:'🔔 Notifications'}]);
  }
  return base;
}
function render(){
  var menu=getMenu(currentRole);
  var side=document.getElementById('side');
  var html='';
  for(var i=0;i<menu.length;i++){ html+='<div class="tab" id="tab-'+menu[i].id+'" onclick="view(\''+menu[i].id+'\')">'+menu[i].label+'</div>'; }
  html+='<div style="margin-top:12px;padding:8px;background:#F5F5F4;border-radius:8px;font-size:11px;color:#78716C">Production v12<br>No test data<br>Role: '+currentRole+'<br>Bulk entry</div>';
  side.innerHTML=html;
  view(menu[0].id);
}

      fetch('/api/students?project_slug=sobukhazi-high-school&limit=100').then(function(r){return r.json();}).then(function(d){ var el=document.getElementById('cStu'); if(el) el.textContent=Array.isArray(d)?d.length:'0'; }).catch(function(){});
      fetch('/api/results?project_slug=sobukhazi-high-school&limit=100').then(function(r){return r.json();}).then(function(d){ var el=document.getElementById('cRes'); if(el) el.textContent=Array.isArray(d)?d.length:'0'; }).catch(function(){});
      fetch('/api/portal/users?project_slug=sobukhazi-high-school&limit=100').then(function(r){return r.json();}).then(function(d){ var el=document.getElementById('cUsers'); if(el) el.textContent=Array.isArray(d)?d.length:'0'; }).catch(function(){});
      fetch('/api/announcements?project_slug=sobukhazi-high-school&limit=5').then(function(r){return r.json();}).then(function(d){ var el=document.getElementById('cAnn'); if(el) el.textContent=Array.isArray(d)?d.length:'0'; }).catch(function(){});

        document.getElementById('annList').innerHTML=html;
      });

    }else if(id==='post'){

    }else if(id==='students'){
      main.innerHTML='<h2>👨‍🎓 Students</h2><div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap"><input id="sSearch" class="input" placeholder="Search name" style="max-width:200px"><select id="sClass" class="input" style="max-width:130px"><option value="">All Classes</option><option>1A</option><option>1B</option><option>2A</option><option>2B</option><option>3A</option><option>3B</option><option>4A</option><option>4B</option><option>5A</option><option>6A</option></select><button class="btn btn-green btn-small" onclick="loadStudents()">Search</button><button class="btn btn-line btn-small" onclick="view(\'addstudent\')">+ Add Student</button></div><div id="sList" class="list" style="margin-top:12px">Loading...</div>';
      loadStudents();

    }else if(id==='addstudent'){
      if(currentRole!=='teacher'&&currentRole!=='admin'&&currentRole!=='maintainer'){ main.innerHTML='<div class="card">Only teacher/admin</div>'; return; }
      main.innerHTML='<h2>➕ Add Student + Parent (Production)</h2><div class="grid2" style="margin-top:12px"><div class="card"><b>Student</b><div style="display:grid;gap:8px;margin-top:10px"><input id="stName" class="input" placeholder="Full Name *"><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><select id="stClass" class="input"><option>1A</option><option>1B</option><option>2A</option><option>2B</option><option>3A</option><option>3B</option><option>4A</option><option>4B</option><option>5A</option><option>5B</option><option>6A</option></select><select id="stGender" class="input"><option value="M">Male</option><option value="F">Female</option></select></div><input id="stEnroll" class="input" placeholder="Enrollment No auto if empty"><input id="stAddress" class="input" placeholder="Address"></div></div><div class="card"><b>Parent — Auto login created</b><div style="display:grid;gap:8px;margin-top:10px"><input id="stParentName" class="input" placeholder="Parent Full Name"><input id="stParentEmail" class="input" placeholder="Parent Email * (for parent portal)"><input id="stParentPhone" class="input" placeholder="Phone 2637..."><select id="stRel" class="input"><option>Parent</option><option>Mother</option><option>Father</option><option>Guardian</option></select><button class="btn btn-green" onclick="addStudent()">Add Student + Create Parent Account</button><div id="stRes" style="font-size:12px"></div><div style="font-size:11px;color:#78716C">Parent gets auto account and sees ONLY this child.</div></div></div></div>';

      loadResults();

    }else if(id==='bulkresults'){
      if(currentRole!=='teacher'&&currentRole!=='admin'&&currentRole!=='maintainer'){ main.innerHTML='<div class="card">Only teacher/admin</div>'; return; }
      main.innerHTML='<h2>⚡ Bulk Results — Zero Extra Work</h2><div class="tabs" style="margin-top:12px"><button class="on" id="tab-sheet" onclick="switchBulkTab(\'sheet\')">📊 Spreadsheet (Class)</button><button id="tab-csv" onclick="switchBulkTab(\'csv\')">📋 Paste from Excel / CSV</button></div><div id="bulk-sheet"><div class="card"><div style="display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:8px"><select id="bClass" class="input"><option>3B</option><option>4A</option><option>2A</option><option>1A</option><option>1B</option><option>2B</option><option>3A</option><option>4B</option><option>5A</option><option>5B</option></select><select id="bTerm" class="input"><option>Term 1</option><option>Term 2</option><option>Term 3</option></select><input id="bYear" class="input" type="number" value="2026"><button class="btn btn-line btn-small" onclick="loadBulkSheet()">Load Class →</button></div><div style="margin-top:10px"><label style="font-size:12px;font-weight:700">Subjects (comma separated — teacher can edit)</label><input id="bSubjects" class="input" value="English, Mathematics, Combined Science, Heritage, Ndebele" style="margin-top:4px"><div style="font-size:11px;color:#78716C;margin-top:4px">Grades auto: A 80+, B 70+, C 60+, D 50+, E 40+, U &lt;40</div></div></div><div id="bulkGrid" style="margin-top:12px"></div><div id="bulkActions" style="margin-top:12px;display:none"><div class="card"><div style="display:grid;gap:8px;max-width:500px"><input id="bTotalStudents" class="input" type="number" placeholder="Total students in class for position e.g. 45"><textarea id="bGeneralComment" class="input" placeholder="General teacher comment for all (optional, can override per student)"></textarea><button class="btn btn-green" onclick="publishBulk()">⚡ Publish All Results → Parents Notified</button><div id="bRes" style="font-size:12px"></div></div></div></div></div><div id="bulk-csv" style="display:none"><div class="card"><b>📋 Paste from Excel / Google Sheets</b><div style="fo function renderBulkGrid(){
  var html='<div class="sheet"><table><thead><tr><th>Student</th>';
  for(var i=0;i<bulkSubjects.length;i++){ html+='<th>'+bulkSubjects[i]+'</th>'; }
  html+='<th>Avg</th><th>Comment</th><th>Pos</th></tr></thead><tbody>';
  for(var r=0;r<bulkData.length;r++){
    var row=bulkData[r];
    html+='<tr><td><b style="font-size:12px">'+row.student_name+'</b></td>';
    for(var c=0;c<bulkSubjects.length;c++){
      var subj=bulkSubjects[c];
      var val=row.scores[subj]||'';
      html+='<td><input type="number" min="0" max="100" data-row="'+r+'" data-subj="'+subj+'" value="'+val+'" placeholder="0-100" oninput="updateBulkScore(this)"></td>';
    }
    html+='<td><span id="avg-'+r+'" style="font-size:12px;font-weight:700">—</span></td>';
    html+='<td><input data-row="'+r+'" data-field="comment" value="'+(row.comment||'').replace(/"/g,'&quot;')+'" placeholder="Comment" oninput="updateBulkField(this)"></td>';
    html+='<td><input type="number" data-row="'+r+'" data-field="position" value="'+(row.position||'')+'" placeholder="#" style="width:60px" oninput="updateBulkField(this)"></td></tr>';
  }
  html+='</tbody></table></div>';
  document.getElementById('bulkGrid').innerHTML=html;
  document.getElementById('bulkActions').style.display='block';
  // calc avgs
  for(var k=0;k<bulkData.length;k++) calcRowAvg(k);
}
function updateBulkScore(el){
  var row=parseInt(el.getAttribute('data-row'));
  var subj=el.getAttribute('data-subj');
  var val=el.value;
  if(!bulkData[row].scores) bulkData[row].scores={};
  bulkData[row].scores[subj]=val;
  calcRowAvg(row);
}
function updateBulkField(el){
  var row=parseInt(el.getAttribute('data-row'));
  var field=el.getAttribute('data-field');
  bulkData[row][field]=el.value;
}
function calcRowAvg(rowIdx){
  var scores=bulkData[rowIdx].scores;
  var total=0, count=0;
  for(var key in scores){ var v=parseInt(scores[key]); if(!isNaN(v) && scores[key]!=='' ){ total+=v; count++; } }
  var avg=count? (total/count).toFixed(1) : '—';
  var el=document.getElementById('avg-'+rowIdx);
  if(el) el.textContent=avg==='—'? '—' : avg+'% ('+gradeFromScore(avg)+')';
}

  var className=(document.getElementById('bClass')||{}).value||'';

// CSV PASTE
var parsedCSV=[];
function parseCSV(){
  var text=(document.getElementById('csvInput')||{}).value||'';
  var className=(document.getElementById('csvClass')||{}).value||'';
  var lines=text.trim().split('\n');
  if(lines.length<1){ alert('Paste data'); return; }
  var firstLine=lines[0].trim();
  var delimiter=firstLine.indexOf('\t')>-1 ? '\t' : ',';
  var headers=firstLine.split(delimiter).map(function(h){return h.trim().toLowerCase();});
  var hasHeader=headers[0].indexOf('name')>-1 || headers[1] && (headers[1].indexOf('english')>-1 || headers[1].indexOf('math')>-1);
  var startIdx=hasHeader?1:0;
  var subjHeaders=hasHeader? headers.slice(1) : [];
  // If no header, assume subjects from bulkSubjects
  if(!hasHeader){ subjHeaders=bulkSubjects.map(function(s){return s.toLowerCase();}); subjHeaders.push('comment'); }
  // Normalize subject headers to proper case
  var subjectMap={}; // lower -> proper
  for(var i=0;i<bulkSubjects.length;i++){ subjectMap[bulkSubjects[i].toLowerCase()]=bulkSubjects[i]; }
  // Also common variations
  subjectMap['english']= 'English'; subjectMap['mathematics']='Mathematics'; subjectMap['maths']='Mathematics'; subjectMap['math']='Mathematics';
  subjectMap['science']='Combined Science'; subjectMap['combined science']='Combined Science'; subjectMap['heritage']='Heritage'; subjectMap['ndebele']='Ndebele';

  parsedCSV=[];
  for(var l=startIdx;l<lines.length;l++){
    var line=lines[l].trim(); if(!line) continue;
    var parts=line.split(delimiter).map(function(p){return p.trim();});
    if(parts.length<2) continue;
    var name=parts[0];
    var scores={}; var comment='';
    for(var c=1;c<parts.length;c++){
      var h=subjHeaders[c-1]||''; // header for this col
      var val=parts[c];
      if(!val) continue;
      if(h.indexOf('comment')>-1 || h.indexOf('remark')>-1){ comment=val; }
      else if(!isNaN(val) && val!=='' ){
        // It's a score
        var properSubj=subjectMap[h] || (h.charAt(0).toUpperCase()+h.slice(1));
        // If header is generic like col1, map by position to bulkSubjects
        if(!subjectMap[h] && bulkSubjects[c-1]) properSubj=bulkSubjects[c-1];
        scores[properSubj]=val;
      }else if(h && subjectMap[h]){
        scores[subjectMap[h]]=val;
      }else{
        // last column maybe comment
        if(c===parts.length-1 && isNaN(val)) comment=val;
        else if(bulkSubjects[c-1]) scores[bulkSubjects[c-1]]=val;
      }
    }
    if(name) parsedCSV.push({student_name:name, scores:scores, teacher_comment:comment});
  }

  var previewEl=document.getElementById('csvPreview');
  var html='<div class="sheet"><table><thead><tr><th>Name</th>';
  // collect all subjects found
  var allSubs={}; for(var p=0;p<parsedCSV.length;p++){ for(var s in parsedCSV[p].scores) allSubs[s]=1; }
  var allSubsList=Object.keys(allSubs);
  for(var a=0;a<allSubsList.length;a++) html+='<th>'+allSubsList[a]+'</th>';
  html+='<th>Comment</th></tr></thead><tbody>';
  for(var r=0;r<parsedCSV.length;r++){ var row=parsedCSV[r]; html+='<tr><td><b style="font-size:12px">'+row.student_name+'</b></td>'; for(var b=0;b<allSubsList.length;b++){ var sub=allSubsList[b]; html+='<td>'+(row.scores[sub]||'—')+'</td>'; } html+='<td style="font-size:11px">'+(row.teacher_comment||'')+'</td></tr>'; }
  html+='</tbody></table></div><div style="font-size:12px;color:#78716C;margin-top:8px">Parsed '+parsedCSV.length+' students — '+allSubsList.join(', ')+'</div>';
  previewEl.innerHTML=html;
  document.getElementById('csvActions').style.display=parsedCSV.length>0?'block':'none';
  bulkSubjects=allSubsList.length>0?allSubsList:bulkSubjects;
}
function publishCSV(){
  var className=(document.getElementById('csvClass')||{}).value||'';
  var term=(document.getElementById('csvTerm')||{}).value||'';
  var year=(document.getElementById('csvYear')||{}).value||'2026';
  var resEl=document.getElementById('csvRes');
  if(parsedCSV.length===0){ if(resEl) resEl.textContent='No data parsed'; return; }
  if(resEl) resEl.textContent='Publishing '+parsedCSV.length+' results...';
  fetch('/api/results/bulk',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({project_slug:'sobukhazi-high-school',class_name:className,term:term,year:year,subjects_list:bulkSubjects,results:parsedCSV,created_by:currentUser?currentUser.email:'',created_by_name:currentUser?currentUser.name:''})}).then(function(r){return r.json();}).then(function(d){
    if(d.error){ if(resEl) resEl.textContent='Error: '+d.error; }
    else{ if(resEl) resEl.textContent='✅ Published '+d.count+' results — Parents notified (private)'; }
  }).catch(function(e){ if(resEl) resEl.textContent='Error: '+e.message; });

}
function addUser(){
  var name=(document.getElementById('uName')||{}).value||''; name=name.trim();
  var email=(document.getElementById('uEmail')||{}).value||''; email=email.trim().toLowerCase();
  var pass=(document.getElementById('uPass')||{}).value||'';
  var phone=(document.getElementById('uPhone')||{}).value||'';
  var role=(document.getElementById('uRole')||{}).value||'parent';
  var resEl=document.getElementById('uRes');
  if(!name||!email||!pass){ if(resEl) resEl.textContent='Fill all'; return; }
  if(resEl) resEl.textContent='Saving...';
  fetch('/api/portal/users',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({project_slug:'sobukhazi-high-school',email:email,password:pass,role:role,name:name,phone:phone,created_by:currentUser?currentUser.email:''})}).then(function(r){return r.json();}).then(function(d){ if(resEl) resEl.textContent=d.error?'Error: '+d.error:'Added '+name; loadUsers(); }).catch(function(e){ if(resEl) resEl.textContent='Error: '+e.message; });
}
function markLate(){
  var stu=(document.getElementById('lStu')||{}).value||'';
  var time=(document.getElementById('lTime')||{}).value||'';
  var reason=(document.getElementById('lReason')||{}).value||'';
  var det=(document.getElementById('lDet')||{}).value||'';
  var resEl=document.getElementById('lRes');
  if(resEl) resEl.textContent='Saving...';
  fetch('/api/attendance/late',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({student_name:stu,class_name:'5B',arrival_time:time,reason:reason,reason_details:det,marked_by_name:currentUser?currentUser.name:''})}).then(function(r){return r.text();}).then(function(t){ if(resEl) resEl.textContent='Saved'; loadLates(); }).catch(function(e){ if(resEl) resEl.textContent='Error: '+e.message; });
}
function loadLates(){
  fetch('/api/attendance/late?limit=10').then(function(r){return r.json();}).then(function(data){
    var html=''; if(Array.isArray(data)){ for(var i=0;i<data.length;i++){ var l=data[i]; html+='<div class="item"><b>'+l.student_name+'</b> '+l.date+' '+(l.arrival_time||'').slice(0,5)+' '+l.reason+'</div>'; } }
    var el=document.getElementById('lList'); if(el) el.innerHTML=html||'No lates';
  });
}
function loadNotifs(){
  var url='/api/notifications?limit=20';
  if(currentRole==='parent' && currentUser && currentUser.email){
    // Parent sees notifications for their child only — filter via students
    fetch('/api/students?project_slug=sobukhazi-high-school&parent_email='+encodeURIComponent(currentUser.email)+'&limit=5').then(function(r){return r.json();}).then(function(students){
      if(students && students.length>0){
        var name=students[0].name;
        fetch('/api/notifications?student='+encodeURIComponent(name)+'&limit=20').then(function(r){return r.json();}).then(function(data){
          var html=''; if(Array.isArray(data)){ for(var i=0;i<data.length;i++){ var n=data[i]; html+='<div class="card" style="padding:10px"><b style="font-size:12px">'+n.title+'</b><div style="font-size:11px">'+n.message.slice(0,150)+'</div><div style="font-size:10px;color:#78716C">'+new Date(n.sent_at).toLocaleString()+'</div></div>'; } }
          var el=document.getElementById('pNotifs')||document.getElementById('nList'); if(el) el.innerHTML=html||'No notifications for your child';
        });
      }else{
        fetch('/api/notifications?limit=20').then(function(r){return r.json();}).then(function(data){
          var html=''; if(Array.isArray(data)){ for(var i=0;i<data.length;i++){ var n=data[i]; html+='<div class="card" style="padding:10px"><b style="font-size:12px">'+n.title+'</b><div style="font-size:11px">'+n.message.slice(0,120)+'</div></div>'; } }
          var el=document.getElementById('pNotifs')||document.getElementById('nList'); if(el) el.innerHTML=html||'No notifications';
        });
      }
    });
  }else{
    fetch(url).then(function(r){return r.json();}).then(function(data){
      var html=''; if(Array.isArray(data)){ for(var i=0;i<data.length;i++){ var n=data[i]; html+='<div class="card" style="padding:10px"><b style="font-size:12px">'+n.title+'</b><div style="font-size:11px">'+n.message.slice(0,120)+'</div></div>'; } }
      var el=document.getElementById('nList'); if(el) el.innerHTML=html||'No notifications';
    });
  }
}
function loadChildData(){
  var email=currentUser?currentUser.email:'';
  document.getElementById('childInfo').innerHTML='Loading...';
  fetch('/api/students?project_slug=sobukhazi-high-school&parent_email='+encodeURIComponent(email)+'&limit=10').then(function(r){return r.json();}).then(function(students){
    var infoEl=document.getElementById('childInfo');
    if(students && students.length>0){
      var s=students[0];
      infoEl.innerHTML='<b>'+s.name+' • '+s.class_name+'</b> • Enroll '+(s.enrollment_no||'')+'<br><span style="font-size:12px;color:#78716C">Parent: '+(s.parent_name||'')+' • '+(s.parent_phone||'')+'<br>Private: Only you see this child (matched by '+email+')</span>';
      loadResults();
      loadNotifs();
    }else{
      infoEl.innerHTML='<b>No student linked to '+email+'</b><br><span style="font-size:12px;color:#78716C">Teacher must add student with parent_email = '+email+' — then you will see ONLY your child. Production privacy.</span>';
      document.getElementById('childResults').innerHTML='<div class="card">No child linked</div>';
      document.getElementById('pNotifs').innerHTML='<div class="card">No notifications</div>';
    }
  });
}
window.onerror=function(m,url,line,col){ var e=document.getElementById('err'); if(e){ e.style.display='block'; e.textContent='Error: '+m+' @ '+line; } return false; };
document.addEventListener('DOMContentLoaded', function(){
  var e=document.getElementById('email'); var p=document.getElementById('pass');
  if(e) e.addEventListener('keydown', function(ev){ if(ev.key==='Enter') login(); });
  if(p) p.addEventListener('keydown', function(ev){ if(ev.key==='Enter') login(); });
});
</script>
