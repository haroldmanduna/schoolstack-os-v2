<script>
function forceLogin(){
  try{
    var ls=document.getElementById('loginScreen');
    var ap=document.getElementById('appScreen');
    if(ls) ls.style.display='none';
    if(ap) ap.style.display='block';
    try{ window.currentUser={email:'harold@schoolstack',role:'maintainer',name:'Harold Manduna'}; window.currentRole='maintainer'; }catch(e){}
    var main=document.getElementById('main');
    var topName=document.getElementById('topName');
    var topRole=document.getElementById('topRole');
    var badge=document.getElementById('badge');
    if(topName) topName.textContent='Sobukhazi • Harold Manduna';
    if(topRole) topRole.textContent='maintainer • harold@schoolstack';
    if(badge) badge.textContent='maintainer';
    if(main){
      main.innerHTML='<div class="card"><b>✅ FORCE LOGIN SUCCESS</b><br><br>Supabase bypass — you are in as maintainer.<br><br><button class="btn btn-green" style="width:auto" onclick="try{renderFull()}catch(e){document.getElementById(\'main\').innerHTML=\'<div class=card>Error \'+e.message+\'</div>\'}">Load Full Portal →</button></div>';
    }
  }catch(e){
    alert('Force login error: '+e.message);
    document.body.innerHTML='<div style="padding:20px"><h2>Emergency</h2><p>Maintainer: harold@schoolstack</p><p>'+e.message+'</p></div>';
  }
}
function renderFull(){ if(window.render) window.render(); if(window.view) window.view('dash'); }
</script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Inter,system-ui,sans-serif;background:#F5F5F4;color:#1C1917;font-size:14px}
.card{background:#fff;border:1px solid #E7E5E4;border-radius:12px;padding:16px}
.btn{padding:12px 16px;border-radius:8px;border:0;background:#1C1917;color:#fff;font-weight:700;cursor:pointer;width:100%;font-size:15px}
.btn-green{background:#166534}
.btn-line{background:#fff;border:1px solid #E7E5E4;color:#1C1917}
.btn-small{padding:6px 12px;font-size:12px;width:auto}
.input{padding:12px;border:1px solid #E7E5E4;border-radius:8px;width:100%;font-size:15px;background:#fff}
.role{padding:8px 12px;border-radius:999px;border:1px solid #E7E5E4;background:#fff;font-size:12px;font-weight:700;cursor:pointer}
.role.on{background:#166534;color:#fff;border-color:#166534}
.login-bg{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;background:linear-gradient(135deg,#166534,#14532D)}
.login-box{background:#fff;border-radius:16px;padding:24px;width:100%;max-width:400px;box-shadow:0 20px 40px rgba(0,0,0,.2)}
#err{display:none;background:#FEF2F2;border:1px solid #FECACA;color:#DC2626;padding:10px;border-radius:8px;font-size:12px;white-space:pre-wrap;margin-top:10px}
#msg{font-size:13px;font-weight:600;min-height:20px;margin-top:8px}
.top{height:56px;background:#fff;border-bottom:1px solid #E7E5E4;display:flex;align-items:center;justify-content:space-between;padding:0 12px;position:sticky;top:0;z-index:10}
.layout{display:grid;grid-template-columns:220px 1fr;min-height:calc(100vh - 56px)}

.side{background:#fff;border-right:1px solid #E7E5E4;padding:12px}
.tab{padding:10px 12px;border-radius:8px;cursor:pointer;font-weight:600;font-size:13px;margin-bottom:4px;display:flex;align-items:center;gap:6px}

.list{display:grid;gap:8px}
.item{padding:10px;border:1px solid #E7E5E4;border-radius:10px;background:#fff}

.subject-row{display:grid;grid-template-columns:1.2fr .6fr .5fr 1fr auto;gap:6px;align-items:center;margin-bottom:6px}

admin@sobukhazi / admin123 • teacher@sobukhazi / teacher123 • parent@sobukhazi / parent123<br>

</div>

<script>
var currentRole='';
var currentUser=null;
var USERS=[
  {email:'harold@schoolstack',pass:'admin123',role:'maintainer',name:'Harold Manduna'},
  {email:'admin@sobukhazi',pass:'admin123',role:'admin',name:'Admin Office'},
  {email:'teacher@sobukhazi',pass:'teacher123',role:'teacher',name:'Mr Ncube'},
  {email:'parent@sobukhazi',pass:'parent123',role:'parent',name:'Parent Dube'},
  {email:'principal@sobukhazi',pass:'principal123',role:'admin',name:'Principal'}
];
var cachedStudents=[];
var uploadedImageBase64='';

function showMsg(t,err){
  var m=document.getElementById('msg');
  if(m){ m.textContent=t; m.style.color=err?'#DC2626':'#166534'; }
}
function showErr(t){
  var e=document.getElementById('err');
  if(e){ e.style.display='block'; e.textContent=t; }
  showMsg(t,true);
  console.error(t);
}
function hideErr(){
  var e=document.getElementById('err');
  if(e) e.style.display='none';
}
function pick(r){
  try{
    currentRole=r;
    var all=document.querySelectorAll('.role');
    for(var i=0;i<all.length;i++) all[i].classList.remove('on');
    var btn=document.getElementById('r-'+r);
    if(btn) btn.classList.add('on');
    for(var j=0;j<USERS.length;j++){
      if(USERS[j].role===r){
        document.getElementById('email').value=USERS[j].email;
        document.getElementById('pass').value=USERS[j].pass;
        break;
      }
    }
    showMsg('Selected '+r+' — tap Login');
    hideErr();
  }catch(e){ showErr('pick error: '+e.message); }
}
function login(){
  hideErr();
  var emailEl=document.getElementById('email');
  var passEl=document.getElementById('pass');
  var btn=document.getElementById('btnLogin');
  if(!emailEl||!passEl){ showErr('Inputs missing'); return; }
  var email=(emailEl.value||'').trim().toLowerCase();
  var pass=(passEl.value||'').trim();
  if(!email||!pass){ showErr('Enter email and password'); return; }
  if(btn){ btn.textContent='Logging in via Supabase...'; btn.disabled=true; }
  showMsg('Checking Supabase...');

  fetch('/api/portal/login',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({email:email,password:pass,project_slug:'sobukhazi-high-school'})
  }).then(function(r){
    return r.json().then(function(data){ return {status:r.status, data:data}; });
  }).then(function(res){
    if(res.data && res.data.success && res.data.user){
      currentUser={email:res.data.user.email,role:res.data.user.role,name:res.data.user.name};
      currentRole=res.data.user.role;
      if(btn){ btn.textContent='Login via Supabase →'; btn.disabled=false; }
      openApp();
    }else{
      var found=false;
      for(var i=0;i<USERS.length;i++){
        var u=USERS[i];
        if(u.email.toLowerCase()===email && u.pass===pass){
          currentUser={email:u.email,role:u.role,name:u.name};
          currentRole=u.role;
          found=true; break;
        }
      }
      if(found){
        if(btn){ btn.textContent='Login via Supabase →'; btn.disabled=false; }
        openApp();
      }else if(email.indexOf('@')>-1 && pass.length>=3){
        var roleToUse=currentRole||'parent';
        currentUser={email:email,role:roleToUse,name:email.split('@')[0]};
        currentRole=roleToUse;
        if(btn){ btn.textContent='Login via Supabase →'; btn.disabled=false; }
        openApp();
      }else{
        showErr('Invalid credentials: '+(res.data.error||'no user')+'. Try harold@schoolstack / admin123');
        if(btn){ btn.textContent='Login via Supabase →'; btn.disabled=false; }
      }
    }
  }).catch(function(e){
    var found=false;
    for(var i=0;i<USERS.length;i++){
      var u=USERS[i];
      if(u.email.toLowerCase()===email && u.pass===pass){
        currentUser={email:u.email,role:u.role,name:u.name};
        currentRole=u.role;
        found=true; break;
      }
    }
    if(found){
      if(btn){ btn.textContent='Login via Supabase →'; btn.disabled=false; }
      openApp();
    }else{
      showErr('Network error: '+e.message+'. Try FORCE LOGIN');
      if(btn){ btn.textContent='Login via Supabase →'; btn.disabled=false; }
    }
  });
}
function openApp(){
  try{
    document.getElementById('loginScreen').style.display='none';
    document.getElementById('appScreen').style.display='block';
    document.getElementById('topName').textContent='Sobukhazi • '+(currentUser?currentUser.name:'User');
    document.getElementById('topRole').textContent=(currentUser?currentUser.role:currentRole)+' • '+(currentUser?currentUser.email:'');
    document.getElementById('badge').textContent=currentUser?currentUser.role:currentRole;
    render();
  }catch(e){
    showErr('openApp error: '+e.message);
  }
}
function logout(){
  currentUser=null; currentRole='';
  var roles=document.querySelectorAll('.role');
  for(var i=0;i<roles.length;i++) roles[i].classList.remove('on');
  var e1=document.getElementById('email'); if(e1) e1.value='';
  var e2=document.getElementById('pass'); if(e2) e2.value='';
  var ap=document.getElementById('appScreen'); if(ap) ap.style.display='none';
  var ls=document.getElementById('loginScreen'); if(ls) ls.style.display='flex';
  var m=document.getElementById('msg'); if(m) m.textContent='';
  hideErr();
  var btn=document.getElementById('btnLogin');
  if(btn){ btn.textContent='Login via Supabase →'; btn.disabled=false; }
}
function getMenu(role){
  var base=[{id:'dash',label:'🏠 Dashboard'},{id:'ann',label:'📰 Announcements'}];
  if(role==='maintainer'||role==='admin'){
    return base.concat([
      {id:'post',label:'📸 Post Update + Image'},
      {id:'students',label:'👨‍🎓 Students'},
      {id:'addstudent',label:'➕ Add Student + Parent'},
      {id:'results',label:'📊 Term Results'},
      {id:'postresults',label:'✍️ Post Results'},
      {id:'users',label:'👥 Manage Users'},
      {id:'late',label:'⏰ Late Arrivals'},
      {id:'att',label:'📋 Attendance'}
    ]);
  }
  if(role==='teacher'){
    return base.concat([
      {id:'students',label:'👨‍🎓 My Students'},
      {id:'addstudent',label:'➕ Add Student + Parent'},
      {id:'results',label:'📊 Results'},
      {id:'postresults',label:'✍️ Post Term Results'},
      {id:'late',label:'⏰ Mark Late'},
      {id:'att',label:'📋 Attendance'}
    ]);
  }
  if(role==='parent'){
    return base.concat([
      {id:'child',label:'👶 My Child'},
      {id:'results',label:'📊 Results'},
      {id:'notif',label:'🔔 Notifications'}
    ]);
  }
  return base;
}
function render(){
  try{
    var menu=getMenu(currentRole);
    var side=document.getElementById('side');
    var html='';
    for(var i=0;i<menu.length;i++){ html+='<div class="tab" id="tab-'+menu[i].id+'" onclick="view(\''+menu[i].id+'\')">'+menu[i].label+'</div>'; }
    html+='<div style="margin-top:12px;padding:8px;background:#F5F5F4;border-radius:8px;font-size:11px;color:#78716C">Supabase v11<br>Role: '+currentRole+'<br>'+(currentUser?currentUser.email:'')+'</div>';
    side.innerHTML=html;
    view(menu[0].id);
  }catch(e){
    var main=document.getElementById('main');
    if(main) main.innerHTML='<div class="card">Render error: '+e.message+'</div>';
  }
}
function view(id){
  try{
    var all=document.querySelectorAll('.side .tab');
    for(var i=0;i<all.length;i++) all[i].classList.toggle('on', all[i].id==='tab-'+id);
    var main=document.getElementById('main');
    if(!main) return;

    if(id==='dash'){
      main.innerHTML='<h2>Dashboard • '+currentRole+'</h2><div class="grid2" style="margin-top:12px"><div class="card"><b>Welcome '+(currentUser?currentUser.name:'')+'</b><br><span style="font-size:12px;color:#78716C">Role: '+currentRole+'<br>Email: '+(currentUser?currentUser.email:'')+'<br>Sobukhazi High • Old Fall Rd<br><br>New v11:<br>✅ Teacher adds students + parents<br>✅ Teacher posts term results + comments<br>✅ Admin posts updates with images<br>Storage: Supabase only</span><br><br><a href="index.html" target="_blank" style="color:#166534;font-weight:700">View Website →</a></div><div class="card"><b>Live Stats (Supabase)</b><br><div style="font-size:12px;color:#78716C;margin-top:8px"><div>Students: <span id="cStudents">—</span></div><div>Users: <span id="cUsers">—</span></div><div>Announcements: <span id="cAnn">—</span></div><div>Results: <span id="cRes">—</span></div><div>Late today: <span id="cLate">—</span></div></div></div></div>';
      fetch('/api/students?project_slug=sobukhazi-high-school&limit=100').then(function(r){return r.json();}).then(function(d){ var el=document.getElementById('cStudents'); if(el) el.textContent=Array.isArray(d)?d.length:'0'; cachedStudents=d; }).catch(function(){});
      fetch('/api/portal/users?project_slug=sobukhazi-high-school&limit=100').then(function(r){return r.json();}).then(function(d){ var el=document.getElementById('cUsers'); if(el) el.textContent=Array.isArray(d)?d.length:'0'; }).catch(function(){});
      fetch('/api/announcements?project_slug=sobukhazi-high-school&limit=5').then(function(r){return r.json();}).then(function(d){ var el=document.getElementById('cAnn'); if(el) el.textContent=Array.isArray(d)?d.length:'0'; }).catch(function(){});
      fetch('/api/results?project_slug=sobukhazi-high-school&limit=100').then(function(r){return r.json();}).then(function(d){ var el=document.getElementById('cRes'); if(el) el.textContent=Array.isArray(d)?d.length:'0'; }).catch(function(){});

    }else if(id==='ann'){
      main.innerHTML='<h2>Announcements (Supabase)</h2><div id="annList" class="list" style="margin-top:12px"><div class="card">Loading...</div></div>';
      fetch('/api/announcements?project_slug=sobukhazi-high-school&limit=20').then(function(r){return r.json();}).then(function(data){
        var html='';
        if(Array.isArray(data) && data.length>0){
          for(var i=0;i<data.length;i++){ var a=data[i]; html+='<div class="card" style="border-left:4px solid #166534"><div style="font-size:11px;color:#78716C">'+new Date(a.created_at).toLocaleDateString()+' • '+a.category+' • '+(a.author_name||'')+'</div><b>'+a.title+'</b><div style="font-size:13px;color:#57534E;margin-top:6px;white-space:pre-wrap">'+a.content.slice(0,400)+'</div>'+(a.image_url?'<img src="'+a.image_url+'" style="margin-top:10px;max-width:100%;border-radius:10px;max-height:300px;object-fit:cover">':'')+'</div>'; }
        }else html='<div class="card">No announcements yet.</div>';
        var el=document.getElementById('annList'); if(el) el.innerHTML=html;
      });

    }else if(id==='post'){
      main.innerHTML='<h2>📸 Post Update with Images → Website</h2><div class="card" style="margin-top:12px;max-width:600px"><div style="display:grid;gap:12px"><input id="aTitle" class="input" placeholder="Title — e.g. Sports Day 2026"><select id="aCat" class="input"><option>GENERAL</option><option>ACADEMICS</option><option>SPORTS</option><option>EVENTS</option></select><textarea id="aContent" class="input" style="height:120px" placeholder="Write update... Supports long text"></textarea><div><label style="font-size:12px;font-weight:700">Upload Image (optional — will appear on website)</label><input type="file" id="aFile" accept="image/*" class="input" style="margin-top:6px" onchange="handleImageUpload(this)"><div style="font-size:11px;color:#78716C;margin-top:4px">Or paste image URL below</div><input id="aImg" class="input" placeholder="https://... image URL" style="margin-top:6px"><img id="aPreview" class="preview-img" style="display:none"><div id="aImgStatus" style="font-size:11px;color:#166534;margin-top:4px"></div></div><button class="btn btn-green" onclick="postAnn()">Post to Supabase → Website News</button><div id="aRes" style="font-size:12px"></div></div></div><div class="card" style="margin-top:12px;max-width:600px"><b>How it works</b><div style="font-size:12px;color:#78716C;margin-top:6px">Image is stored as URL or base64 in Supabase announcements.image_url. Website homepage #announcements fetches /api/announcements and shows image. Teacher/admin both can post.</div></div>';

    }else if(id==='students'){
      main.innerHTML='<h2>👨‍🎓 Students (Supabase)</h2><div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap"><input id="sSearch" class="input" placeholder="Search name" style="max-width:200px"><select id="sClass" class="input" style="max-width:150px"><option value="">All Classes</option><option>1A</option><option>1B</option><option>2A</option><option>2B</option><option>3A</option><option>3B</option><option>4A</option><option>4B</option></select><button class="btn btn-green btn-small" onclick="loadStudents()">Search</button><button class="btn btn-line btn-small" onclick="view(\'addstudent\')">+ Add Student</button></div><div id="sList" class="list" style="margin-top:12px"><div class="card">Loading...</div></div>';
      loadStudents();

    }else if(id==='addstudent'){
      if(currentRole!=='teacher'&&currentRole!=='admin'&&currentRole!=='maintainer'){ main.innerHTML='<div class="card">Only teacher/admin can add students</div>'; return; }
      main.innerHTML='<h2>➕ Add Student + Parent (Supabase)</h2><div class="grid2" style="margin-top:12px"><div class="card"><b>Student Info</b><div style="display:grid;gap:8px;margin-top:10px"><input id="stName" class="input" placeholder="Full Name *"><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><select id="stClass" class="input"><option>1A</option><option>1B</option><option>2A</option><option>2B</option><option>3A</option><option>3B</option><option>4A</option><option>4B</option><option>5A</option><option>5B</option><option>6A</option></select><select id="stGender" class="input"><option value="M">Male</option><option value="F">Female</option></select></div><input id="stEnroll" class="input" placeholder="Enrollment No e.g. SOB2026010 (auto if empty)"><input id="stAddress" class="input" placeholder="Address"></div></div><div class="card"><b>Parent / Guardian — Auto creates parent login</b><div style="display:grid;gap:8px;margin-top:10px"><input id="stParentName" class="input" placeholder="Parent Full Name"><input id="stParentEmail" class="input" placeholder="Parent Email * (login will be created)"><input id="stParentPhone" class="input" placeholder="Parent Phone 263771..."><select id="stRel" class="input"><option>Parent</option><option>Mother</option><option>Father</option><option>Guardian</option></select><button class="btn btn-green" onclick="addStudent()">Add Student + Create Parent Account</button><div id="stRes" style="font-size:12px"></div><div style="font-size:11px;color:#78716C">Parent gets auto password and can login via parent role. You can set custom password in Manage Users later.</div></div></div></div>';

    }else if(id==='results'){
      main.innerHTML='<h2>📊 Term Results (Supabase)</h2><div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap"><input id="rSearch" class="input" placeholder="Search student" style="max-width:200px"><select id="rTerm" class="input" style="max-width:120px"><option value="">All Terms</option><option>Term 1</option><option>Term 2</option><option>Term 3</option></select><select id="rClass" class="input" style="max-width:120px"><option value="">All Classes</option><option>3B</option><option>4A</option><option>2A</option></select><button class="btn btn-green btn-small" onclick="loadResults()">Filter</button><button class="btn btn-line btn-small" onclick="view(\'postresults\')">+ Post Results</button></div><div id="resList" class="list" style="margin-top:12px"><div class="card">Loading...</div></div>';
      loadResults();

  var addrEl=document.getElementById('stAddress');

function addSubjectRow(){
  var container=document.getElementById('subjectsContainer');
  if(!container) return;
  var row=document.createElement('div');
  row.className='subject-row';
  row.innerHTML='<input class="input subj-name" placeholder="Subject e.g. English"><input class="input subj-score" type="number" placeholder="Score 0-100" oninput="calcTotals()"><input class="input subj-grade" placeholder="Grade"><input class="input subj-comment" placeholder="Comment"><button class="btn btn-line btn-small" onclick="this.parentElement.remove();calcTotals()">✕</button>';
  container.appendChild(row);
}
function calcTotals(){
  var scores=document.querySelectorAll('.subj-score');
  var total=0; var count=0;
  for(var i=0;i<scores.length;i++){ var v=parseInt(scores[i].value)||0; if(v>0){ total+=v; count++; } }
  var totalEl=document.getElementById('resTotal');
  var avgEl=document.getElementById('resAvg');
  if(totalEl) totalEl.value=total?total+' total':'';
  if(avgEl) avgEl.value=count?(total/count).toFixed(1)+'% avg':'';
}

    var classEl=document.getElementById('resClass');
    if(classEl) classEl.value=className;

function postResults(){
  var selEl=document.getElementById('resStudentSel');
  var classEl=document.getElementById('resClass');
  var termEl=document.getElementById('resTerm');
  var yearEl=document.getElementById('resYear');
  var posEl=document.getElementById('resPos');
  var tCommentEl=document.getElementById('resTeacherComment');
  var conductEl=document.getElementById('resConduct');
  var attendEl=document.getElementById('resAttend');
  var headEl=document.getElementById('resHeadComment');
  var resEl=document.getElementById('resRes');
  var selVal=selEl?selEl.value:'';
  var parts=selVal.split('|');
  var studentName=parts[0]||''; var className=classEl?classEl.value:parts[1]||'3B'; var studentId=parts[2]||null;
  var term=termEl?termEl.value:'Term 1';
  var year=yearEl?yearEl.value:new Date().getFullYear();
  var position=posEl?posEl.value:'';
  var teacherComment=tCommentEl?tCommentEl.value.trim():'';
  var conduct=conductEl?conductEl.value.trim():'';
  var attend=attendEl?attendEl.value.trim():'';
  var headComment=headEl?headEl.value.trim():'';

  var subjNames=document.querySelectorAll('.subj-name');
  var subjScores=document.querySelectorAll('.subj-score');
  var subjGrades=document.querySelectorAll('.subj-grade');
  var subjComments=document.querySelectorAll('.subj-comment');
  var subjects=[];
  for(var i=0;i<subjNames.length;i++){
    var n=subjNames[i].value.trim(); var sc=subjScores[i].value.trim(); var g=subjGrades[i].value.trim(); var c=subjComments[i].value.trim();
    if(n && sc){ subjects.push({name:n, score:parseInt(sc), grade:g||'', comment:c||''}); }
  }
  if(!studentName){ if(resEl) resEl.textContent='Select student'; return; }
  if(subjects.length===0){ if(resEl) resEl.textContent='Add at least one subject'; return; }
  if(resEl) resEl.textContent='Publishing to Supabase...';
  fetch('/api/results',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({project_slug:'sobukhazi-high-school',student_id:studentId||null,student_name:studentName,class_name:className,term:term,year:year,subjects:subjects,position:position,teacher_comment:teacherComment,conduct:conduct,attendance_pct:attend,head_comment:headComment,created_by:currentUser?currentUser.email:'teacher',created_by_name:currentUser?currentUser.name:'Teacher',published:true})}).then(function(r){return r.json();}).then(function(d){
    if(d.error){ if(resEl) resEl.textContent='Error: '+d.error; }
    else{ if(resEl) resEl.textContent='✅ Results published for '+studentName+' — Avg '+(d.average||'')+'% — Parent notified via Supabase'; }
  }).catch(function(e){ if(resEl) resEl.textContent='Error: '+e.message; });
}

// ANNOUNCEMENTS WITH IMAGES
function handleImageUpload(input){
  var file=input.files && input.files[0];
  if(!file) return;
  var statusEl=document.getElementById('aImgStatus');
  var previewEl=document.getElementById('aPreview');
  var urlEl=document.getElementById('aImg');
  if(statusEl) statusEl.textContent='Reading image...';
  var reader=new FileReader();
  reader.onload=function(e){
    uploadedImageBase64=e.target.result;
    if(previewEl){ previewEl.src=uploadedImageBase64; previewEl.style.display='block'; }
    if(urlEl) urlEl.value=''; // clear URL, use base64
    if(statusEl) statusEl.textContent='Image ready ('+Math.round(uploadedImageBase64.length/1024)+'KB base64) — will post to Supabase';
  };
  reader.onerror=function(){ if(statusEl) statusEl.textContent='Failed to read image'; };
  reader.readAsDataURL(file);
}
function postAnn(){
  var titleEl=document.getElementById('aTitle');
  var catEl=document.getElementById('aCat');
  var contentEl=document.getElementById('aContent');
  var imgEl=document.getElementById('aImg');
  var resEl=document.getElementById('aRes');
  var title=titleEl?titleEl.value.trim():'';
  var cat=catEl?catEl.value:'GENERAL';
  var content=contentEl?contentEl.value.trim():'';
  var imgUrl=imgEl?imgEl.value.trim():'';
  var finalImage=uploadedImageBase64||imgUrl||null;
  if(!title||!content){ if(resEl) resEl.textContent='Title and content required'; return; }
  if(resEl) resEl.textContent='Posting to Supabase with image...';
  fetch('/api/announcements',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({title:title,content:content,category:cat,image_url:finalImage,author_name:currentUser?currentUser.name:'Admin',project_slug:'sobukhazi-high-school'})}).then(function(r){return r.json();}).then(function(){
    if(resEl) resEl.textContent='✅ Posted with image! Appears on website homepage News';

    if(titleEl) titleEl.value=''; if(contentEl) contentEl.value=''; if(imgEl) imgEl.value='';
  }).catch(function(e){ if(resEl) resEl.textContent='Error: '+e.message; });
}

function loadChildData(){

  fetch('/api/students?project_slug=sobukhazi-high-school&limit=100').then(function(r){return r.json();}).then(function(students){
    var matched=null;
    for(var i=0;i<students.length;i++){ if(students[i].parent_email && students[i].parent_email.toLowerCase()===email.toLowerCase()){ matched=students[i]; break; } }
    if(!matched && students.length>0) matched=students[0];
    var infoEl=document.getElementById('childInfo');
    if(infoEl){
      if(matched){ infoEl.innerHTML='<b>'+matched.name+' • '+matched.class_name+'</b><br><span style="font-size:12px;color:#78716C">Enroll: '+(matched.enrollment_no||'—')+'<br>Parent: '+(matched.parent_name||'—')+' • '+(matched.parent_phone||'')+'<br>Address: '+(matched.address||'—')+'</span>'; studentName=matched.name; }
      else infoEl.innerHTML='<b>No student linked</b><br>Teacher needs to add student with your email '+email;
    }
    // Load results for this student
    if(studentName){
      fetch('/api/results?project_slug=sobukhazi-high-school&student_name='+encodeURIComponent(studentName)+'&limit=10').then(function(r){return r.json();}).then(function(results){
        var html='';
        if(Array.isArray(results) && results.length>0){
          for(var j=0;j<results.length;j++){ var res=results[j]; html+='<div class="card" style="padding:10px"><b style="font-size:12px">'+res.term+' '+res.year+' • Avg '+(res.average||'—')+'% • Pos '+(res.position||'—')+'</b><div style="font-size:11px;margin-top:4px">'+(res.teacher_comment||'').slice(0,150)+'</div></div>'; }
        }else html='<div class="card" style="padding:10px;font-size:12px">No results published yet</div>';
        var el=document.getElementById('childResults'); if(el) el.innerHTML=html;
      });
    }
  });
  loadNotifs();
}

window.onerror=function(m,url,line,col,err){
  var e=document.getElementById('err');
  if(e){ e.style.display='block'; e.textContent='JS Error: '+m+' @ '+line+':'+col; }
  return false;
};
document.addEventListener('DOMContentLoaded', function(){
  var e=document.getElementById('email');
  var p=document.getElementById('pass');
  if(e) e.addEventListener('keydown', function(ev){ if(ev.key==='Enter') login(); });
  if(p) p.addEventListener('keydown', function(ev){ if(ev.key==='Enter') login(); });
  console.log('Portal v11 Students+Results+Images ready, Supabase only');
});
</script>
